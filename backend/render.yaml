services:
  - type: web
    name: mern-ecommerce-api
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - fromSecret:
          key: MONGO_URI
      - fromSecret:
          key: JWT_SECRET